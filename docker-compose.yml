services:
  epg:
    build: .
    container_name: epg-rewriter
    restart: unless-stopped
    ports:
      - "29956:8080"
    # Without this the json-file driver grows without bound. Every request is
    # logged, and a publicly reachable host is probed continuously, so the file
    # would keep growing until it filled the disk.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # A named volume, not a relative bind mount: Docker silently creates a
      # missing bind source as an empty root-owned directory, which left the
      # service with no channel list and no way to report it clearly.
      # The image seeds channels.txt here on first run; edit it to customise.
      - epg-data:/data
    environment:
      # Every tunable falls back to the value shown, so the stack runs with no
      # .env at all. Override any of them there or in the deployment.
      #
      # Comma-separated. Add more sources to lift the coverage ceiling.
      EPG_SOURCES: "${EPG_SOURCES:-https://iptv-epg.org/files/epg-es.xml.gz}"
      # Matches the upstream regeneration cycle.
      REFRESH_HOURS: "${REFRESH_HOURS:-3}"
      FUZZY_CUTOFF: "${FUZZY_CUTOFF:-0.92}"
      # Gates the guide URL itself. Players cannot send headers, so the token
      # travels in the URL: /<token>/epg.xml.gz or ?token=<value>.
      # Leave unset to serve the guide openly. Set it from a .env file or the
      # deployment's environment; never commit the value.
      GUIDE_TOKEN: "${GUIDE_TOKEN:-}"
      # Gates /status and /refresh. REQUIRED behind a reverse proxy: every
      # request then arrives with the proxy's private address, so the
      # private-caller check alone would admit the whole internet.
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"

volumes:
  epg-data:
